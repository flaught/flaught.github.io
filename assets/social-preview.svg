<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5ec3e8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- blueprint background -->
  <rect width="1280" height="640" fill="#0e3450"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- drafting title-block border -->
  <rect x="40" y="40" width="1200" height="560" fill="none" stroke="#2a5d83" stroke-width="1.5"/>

  <!-- accent bar -->
  <rect x="92" y="118" width="90" height="5" fill="#5ec3e8"/>

  <!-- F mark tile -->
  <rect x="92" y="158" width="124" height="124" rx="24" fill="#13405f" stroke="#5ec3e8" stroke-width="2"/>
  <text x="154" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="bold" fill="#5ec3e8" text-anchor="middle">F</text>

  <!-- title -->
  <text x="250" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#e9f2fb">Flaught</text>

  <!-- tagline -->
  <text x="92" y="372" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#5ec3e8">The designated skeptic for your coding agent.</text>

  <!-- subhead (two lines) -->
  <text x="92" y="430" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#a5c5e3">Your agent wrote the code, the tests, and the PR summary.</text>
  <text x="92" y="468" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#a5c5e3">Flaught is the independent party that checks.</text>

  <!-- footer -->
  <text x="92" y="556" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#6f9bc6">adversarial review for agent-authored code  ·  advocatus diaboli</text>
</svg>