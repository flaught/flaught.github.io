<svg width="100%" viewBox="0 0 680 556" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flaught finding resolution flow</title>
<desc>A finding is always reported and the dashboard always updates. Resolution routing to a human or to the agent is a policy choice. If routed to the agent, Flaught re-verifies the fix against the diff before marking it resolved; if the fix does not hold up, it escalates to a human instead. If routed to a human, the human's fix is trusted directly. Dismissing a finding without fixing it always requires a human, regardless of which path was used.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .t { font-size: 14px; font-weight: 500; }
  .s { font-size: 12px; font-weight: 400; }
  rect.box { fill: #F1EFE8; stroke: #5F5E5A; }
  .box .t { fill: #444441; }
  .box .s { fill: #5F5E5A; }
  rect.gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .t { fill: #444441; } .gray .s { fill: #5F5E5A; }
  rect.teal { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .t { fill: #085041; } .teal .s { fill: #0F6E56; }
  rect.blue { fill: #E6F1FB; stroke: #185FA5; }
  .blue .t { fill: #0C447C; } .blue .s { fill: #185FA5; }
  rect.amber { fill: #FAEEDA; stroke: #854F0B; }
  .amber .t { fill: #633806; } .amber .s { fill: #854F0B; }
  rect.green { fill: #EAF3DE; stroke: #3B6D11; }
  .green .t { fill: #27500A; } .green .s { fill: #3B6D11; }
  rect.red { fill: #FCEBEB; stroke: #A32D2D; }
  .red .t { fill: #501313; } .red .s { fill: #A32D2D; }
  path.arr, line.arr { stroke: #8A8A85; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    rect.box, rect.gray { fill: #444441; stroke: #B4B2A9; }
    .box .t, .gray .t { fill: #D3D1C7; } .box .s, .gray .s { fill: #B4B2A9; }
    rect.teal { fill: #085041; stroke: #5DCAA5; }
    .teal .t { fill: #9FE1CB; } .teal .s { fill: #5DCAA5; }
    rect.blue { fill: #0C447C; stroke: #85B7EB; }
    .blue .t { fill: #B5D4F4; } .blue .s { fill: #85B7EB; }
    rect.amber { fill: #633806; stroke: #EF9F27; }
    .amber .t { fill: #FAC775; } .amber .s { fill: #EF9F27; }
    rect.green { fill: #27500A; stroke: #97C459; }
    .green .t { fill: #C0DD97; } .green .s { fill: #97C459; }
    rect.red { fill: #791F1F; stroke: #F09595; }
    .red .t { fill: #F7C1C1; } .red .s { fill: #F09595; }
    path.arr, line.arr { stroke: #7A7A75; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line class="arr" x1="340" y1="64" x2="340" y2="100" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="160" x2="204" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="160" x2="476" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="256" x2="480" y2="292" marker-end="url(#arrow)"/>
<path class="arr" d="M200 256 L220 392" marker-end="url(#arrow)"/>
<path class="arr" d="M440 352 L280 392" marker-end="url(#arrow)"/>
<path class="arr" d="M520 352 L500 392" marker-end="url(#arrow)"/>

<g class="gray">
<rect class="gray" x="240" y="20" width="200" height="44" rx="8" stroke-width="1"/>
<text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">Finding detected</text>
</g>

<g class="teal">
<rect class="teal" x="210" y="104" width="260" height="56" rx="8" stroke-width="1"/>
<text class="t" x="340" y="122" text-anchor="middle" dominant-baseline="central">Report generated</text>
<text class="s" x="340" y="140" text-anchor="middle" dominant-baseline="central">Dashboard always updates</text>
</g>

<g class="blue">
<rect class="blue" x="90" y="200" width="220" height="56" rx="8" stroke-width="1"/>
<text class="t" x="200" y="218" text-anchor="middle" dominant-baseline="central">Routed to human</text>
<text class="s" x="200" y="236" text-anchor="middle" dominant-baseline="central">Policy decides</text>
</g>

<g class="blue">
<rect class="blue" x="370" y="200" width="220" height="56" rx="8" stroke-width="1"/>
<text class="t" x="480" y="218" text-anchor="middle" dominant-baseline="central">Routed to agent</text>
<text class="s" x="480" y="236" text-anchor="middle" dominant-baseline="central">Policy decides</text>
</g>

<g class="amber">
<rect class="amber" x="360" y="296" width="240" height="56" rx="8" stroke-width="1"/>
<text class="t" x="480" y="314" text-anchor="middle" dominant-baseline="central">Re-verified against diff</text>
<text class="s" x="480" y="332" text-anchor="middle" dominant-baseline="central">Checked before closing</text>
</g>

<g class="green">
<rect class="green" x="150" y="396" width="200" height="56" rx="8" stroke-width="1"/>
<text class="t" x="250" y="414" text-anchor="middle" dominant-baseline="central">Resolved</text>
<text class="s" x="250" y="432" text-anchor="middle" dominant-baseline="central">Finding closed</text>
</g>

<g class="red">
<rect class="red" x="390" y="396" width="220" height="56" rx="8" stroke-width="1"/>
<text class="t" x="500" y="414" text-anchor="middle" dominant-baseline="central">Not resolved</text>
<text class="s" x="500" y="432" text-anchor="middle" dominant-baseline="central">Escalated to human</text>
</g>

<rect class="box" x="90" y="492" width="520" height="44" rx="8" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="350" y="514" text-anchor="middle" dominant-baseline="central">Dismiss (suppress without fixing) always requires a human, on either path</text>
</svg>
