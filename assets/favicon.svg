<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0e3450"/>
  <!-- blueprint grid as explicit lines (rasterizer doesn't resolve <pattern>) -->
  <path d="M20 0V100 M40 0V100 M60 0V100 M80 0V100 M0 20H100 M0 40H100 M0 60H100 M0 80H100"
        fill="none" stroke="#5ec3e8" stroke-opacity="0.18" stroke-width="1"/>
  <!-- F: same serif as the hero wordmark, centered, cyan -->
  <text x="50" y="80" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
        font-size="76" font-weight="bold" fill="#5ec3e8" text-anchor="middle">F</text>
</svg>