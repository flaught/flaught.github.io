<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- blueprint background, full-bleed (opaque corners for apple-touch) -->
  <rect width="64" height="64" fill="#0e3450"/>
  <!-- subtle drafting grid -->
  <g stroke="#5ec3e8" stroke-opacity="0.07" stroke-width="1">
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
  </g>
  <!-- magnifying glass lens -->
  <circle cx="25" cy="25" r="15" fill="#13405f" stroke="#5ec3e8" stroke-width="3.5"/>
  <!-- handle -->
  <line x1="36" y1="36" x2="51" y2="51" stroke="#5ec3e8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- F inside the lens -->
  <text x="25" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#e9f2fb" text-anchor="middle">F</text>
</svg>